name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Quality & Test Matrix
  # ----------------------------------------------------------------------------
  quality-and-test:
    name: Node.js ${{ matrix.node-version }} Test & Typecheck
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Run Vitest Integration Test Suite
        run: npm test

      - name: Compile Production Build
        run: npm run build

  # ----------------------------------------------------------------------------
  # 2. Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build-check:
    name: Dockerfile Build Verification
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run / Cache Check)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smart-qr-print-backend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
